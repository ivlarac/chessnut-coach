name: iOS Build, Tests & IPA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache Stockfish 18 NNUE networks
        uses: actions/cache@v4
        with:
          path: StockfishNetworks
          key: stockfish18-nnue-c288c895ea92-37f18f62d772

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ChessnutCoach.xcodeproj -scheme ChessnutCoach

      - name: Build unsigned IPA for iPhone
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/ChessnutCoachDerivedData"
          PACKAGE_DIR="$RUNNER_TEMP/ChessnutCoachIPA"

          xcodebuild \
            -project ChessnutCoach.xcodeproj \
            -scheme ChessnutCoach \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "No .app bundle found after device build" >&2
            exit 1
          fi

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
          (
            cd "$PACKAGE_DIR"
            zip -qry "$GITHUB_WORKSPACE/ChessnutCoach.ipa" Payload
          )

          echo "Created $GITHUB_WORKSPACE/ChessnutCoach.ipa"
          ls -lh "$GITHUB_WORKSPACE/ChessnutCoach.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChessnutCoach-IPA
          path: ChessnutCoach.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Build for iOS Simulator
        id: iosbuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ChessnutCoach.xcodeproj \
            -scheme ChessnutCoach \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Show concise build errors
        if: steps.iosbuild.outcome == 'failure'
        run: |
          echo '--- relevant xcodebuild errors ---'
          grep -E '(^| )error:|fatal error:|PhaseScriptExecution|Stockfish|BUILD FAILED|Undefined symbols|ld:' /tmp/xcodebuild.log | tail -250 || true

      - name: Upload build log on failure
        if: steps.iosbuild.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-build-log
          path: /tmp/xcodebuild.log
          retention-days: 2

      - name: Fail after build diagnostics
        if: steps.iosbuild.outcome == 'failure'
        run: exit 1

      - name: Run iOS unit and Stockfish runtime tests
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin).get("devices", {})
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iOS Simulator found")
          ')"
          echo "Using iOS Simulator $SIMULATOR_ID"
          xcodebuild \
            -project ChessnutCoach.xcodeproj \
            -scheme ChessnutCoach \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Run game-core unit tests
        run: swift test
