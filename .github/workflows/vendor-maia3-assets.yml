name: Vendor Maia 3 assets once

on:
  push:
    branches:
      - feature/multi-engine-maia3

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether assets already exist
        id: assets
        run: |
          if [[ -f Vendor/Maia3/source/maia3-5m.pt && -f ChessnutCoach/Models/Maia3_5M.mlpackage/Data/com.apple.CoreML/weights/weight.bin ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install conversion dependencies
        if: steps.assets.outputs.present == 'false'
        run: |
          python3 -m venv /tmp/maia3-convert
          /tmp/maia3-convert/bin/pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          /tmp/maia3-convert/bin/pip install --disable-pip-version-check coremltools==9.0 python-chess==1.999

      - name: Download verified checkpoint and convert
        if: steps.assets.outputs.present == 'false'
        run: |
          curl --fail --location --retry 3 \
            --output Vendor/Maia3/source/maia3-5m.pt \
            https://huggingface.co/UofTCSSLab/Maia3-5M/resolve/b6559de2398d7140b985f28fd2c19fb5e47ddabe/maia3-5m.pt
          echo "ba14208b2992d85502f5fb501934abf6aaaeb355e9f3fdf90e326911f562524f  Vendor/Maia3/source/maia3-5m.pt" | sha256sum --check
          mkdir -p ChessnutCoach/Models
          /tmp/maia3-convert/bin/python Scripts/convert_maia3_coreml.py

      - name: Commit generated corresponding source and Core ML model
        if: steps.assets.outputs.present == 'false'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Vendor/Maia3/source/maia3-5m.pt ChessnutCoach/Models/Maia3_5M.mlpackage
          git rm .github/workflows/vendor-maia3-assets.yml
          git commit -m "Bundle verified Maia3-5M Core ML model"
          git push
