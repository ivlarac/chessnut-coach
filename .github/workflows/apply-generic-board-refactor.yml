name: Apply Generic Board Refactor

on:
  push:
    branches:
      - feature/generic-electronic-board

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.event.head_commit.message != 'Apply generic board refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-electronic-board
          fetch-depth: 0

      - name: Apply refactor
        run: python3 Scripts/apply_generic_board_refactor.py

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChessnutCoach/BoardController.swift ChessnutCoach/CurrentGameView.swift ChessnutCoach/ContentView.swift ChessnutCoachTests/OTBGameSessionTests.swift ChessnutCoach.xcodeproj/project.pbxproj Package.swift
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply generic board refactor"
          git push origin HEAD:feature/generic-electronic-board
