name: Fix White Piece PNG Format

on:
  push:
    branches:
      - feature/png-chess-pieces-0.0.18

permissions:
  contents: write

jobs:
  reencode-white-pieces:
    if: github.event.head_commit.message != 'Re-encode white chess pieces as RGBA PNG'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/png-chess-pieces-0.0.18
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Re-encode white piece PNGs as RGBA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path('ChessnutCoach/Assets.xcassets')
          names = [
              'white_king',
              'white_queen',
              'white_rook',
              'white_bishop',
              'white_knight',
              'white_pawn',
          ]

          for name in names:
              path = assets / f'{name}.imageset' / f'{name}.png'
              with Image.open(path) as image:
                  rgba = image.convert('RGBA')
                  rgba.save(path, format='PNG', optimize=True, compress_level=9)

              with Image.open(path) as check:
                  if check.mode != 'RGBA':
                      raise RuntimeError(f'{path} was not saved as RGBA: {check.mode}')
                  print(f'{path}: {check.mode} {check.size}')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-white-piece-png-format.yml

      - name: Commit corrected PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChessnutCoach/Assets.xcassets/white_*.imageset/white_*.png .github/workflows/fix-white-piece-png-format.yml
          git commit -m 'Re-encode white chess pieces as RGBA PNG'
          git push origin HEAD:feature/png-chess-pieces-0.0.18
