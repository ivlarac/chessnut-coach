name: Apply PNG Chess Piece Assets

on:
  push:
    branches:
      - feature/png-chess-pieces-0.0.18

permissions:
  contents: write

jobs:
  apply-assets:
    if: github.event.head_commit.message != 'Use PNG chess piece assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/png-chess-pieces-0.0.18
          fetch-depth: 0

      - name: Apply focused PNG piece changes
        run: python3 Scripts/apply_png_piece_assets.py

      - name: Validate patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -R "Text(piece.textSymbol)" ChessnutCoach ChessnutCoachTests; then
            echo 'Unicode piece renderer still present' >&2
            exit 1
          fi
          test "$(find ChessnutCoach/Assets.xcassets -maxdepth 1 -type d -name '*_*.imageset' | wc -l | tr -d ' ')" -ge 12

      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m 'Use PNG chess piece assets'
          git push origin HEAD:feature/png-chess-pieces-0.0.18
