name: Finalize PNG Piece Asset Test

on:
  push:
    branches:
      - feature/png-chess-pieces-0.0.18

permissions:
  contents: write

jobs:
  finalize-test:
    if: github.event.head_commit.message == 'Finalize PNG piece asset test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/png-chess-pieces-0.0.18
          fetch-depth: 0
      - name: Restore main test file and replace only target test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- ChessnutCoachTests/OTBGameSessionTests.swift
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('ChessnutCoachTests/OTBGameSessionTests.swift')
          text = path.read_text()
          pattern = r'''    func testReplayBoardUsesFENColorAndForcesTextPresentationForEveryPiece\(\) throws \{.*?        XCTAssertNil\(GameReplay\.piece\(in: fen, rankIndex: 4, fileIndex: 4\)\)\n    \}'''
          function_body = textwrap.dedent('''\
          func testReplayBoardUsesFENColorAndAssetMappingForEveryPiece() throws {
              let fen = Position.standard.fen
              let blackBackRankAssets = [
                  "black_rook", "black_knight", "black_bishop", "black_queen",
                  "black_king", "black_bishop", "black_knight", "black_rook",
              ]
              let whiteBackRankAssets = [
                  "white_rook", "white_knight", "white_bishop", "white_queen",
                  "white_king", "white_bishop", "white_knight", "white_rook",
              ]

              for file in 0..<8 {
                  let blackBackRank = try XCTUnwrap(
                      GameReplay.piece(in: fen, rankIndex: 0, fileIndex: file)
                  )
                  let blackPawn = try XCTUnwrap(
                      GameReplay.piece(in: fen, rankIndex: 1, fileIndex: file)
                  )
                  let whitePawn = try XCTUnwrap(
                      GameReplay.piece(in: fen, rankIndex: 6, fileIndex: file)
                  )
                  let whiteBackRank = try XCTUnwrap(
                      GameReplay.piece(in: fen, rankIndex: 7, fileIndex: file)
                  )

                  XCTAssertEqual(blackBackRank.color, .black)
                  XCTAssertEqual(blackPawn.color, .black)
                  XCTAssertEqual(whitePawn.color, .white)
                  XCTAssertEqual(whiteBackRank.color, .white)
                  XCTAssertEqual(blackBackRank.assetName, blackBackRankAssets[file])
                  XCTAssertEqual(blackPawn.assetName, "black_pawn")
                  XCTAssertEqual(whitePawn.assetName, "white_pawn")
                  XCTAssertEqual(whiteBackRank.assetName, whiteBackRankAssets[file])
              }

              XCTAssertNil(GameReplay.piece(in: fen, rankIndex: 4, fileIndex: 4))
          }
          ''').rstrip()
          replacement = textwrap.indent(function_body, '    ')
          updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one Unicode replay-piece test, found {count}')
          path.write_text(updated)
          PY
          git diff --check
          git rm .github/workflows/finalize-png-piece-test.yml
      - name: Commit final focused test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChessnutCoachTests/OTBGameSessionTests.swift
          git commit -m 'Finalize piece asset mapping test'
          git push origin HEAD:feature/png-chess-pieces-0.0.18
